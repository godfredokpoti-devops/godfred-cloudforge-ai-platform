apiVersion: v1
kind: ServiceAccount
metadata:
  name: platform-api
  namespace: platform
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  namespace: platform
  name: platform-readonly
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "configmaps"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: platform-readonly-binding
  namespace: platform
subjects:
  - kind: ServiceAccount
    name: platform-api
    namespace: platform
roleRef:
  kind: Role
  name: platform-readonly
  apiGroup: rbac.authorization.k8s.io
