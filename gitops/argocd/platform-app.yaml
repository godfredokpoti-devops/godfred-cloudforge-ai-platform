apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cloudforge-platform
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/godfred.os.deyoung/cloudforge-ai-platform.git
    targetRevision: HEAD
    path: kubernetes
  destination:
    server: https://kubernetes.default.svc
    namespace: platform
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
